<style>
  :root{--bg:#0b1020;--panel:#121a2e;--ink:#e8edf7;--mut:#9fb0d0;--line:#26304a;--accent:#2f6fdb;}
  *{box-sizing:border-box;} html,body{margin:0;height:100%;}
  body{background:var(--bg);color:var(--ink);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;}
  header{padding:14px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:18px;flex-wrap:wrap;}
  header h1{font-size:17px;margin:0;}
  header .sub{color:var(--mut);font-size:12.5px;}
  .spacer{flex:1;}
  .toggle{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;}
  .toggle button{background:transparent;color:var(--mut);border:0;padding:7px 16px;font-size:13px;cursor:pointer;}
  .toggle button.active{background:var(--accent);color:#04130a;font-weight:600;}
  .legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--mut);}
  .legend span{display:inline-flex;align-items:center;gap:5px;}
  .dot{width:10px;height:10px;border-radius:3px;display:inline-block;}
  a.gallery{color:var(--accent);text-decoration:none;font-size:12.5px;border:1px solid var(--line);padding:6px 12px;border-radius:8px;}
  a.gallery:hover{border-color:var(--accent);}
  #net{width:100%;height:calc(100vh - 120px);}
  /* lightbox */
  #lb{position:fixed;inset:0;background:rgba(4,7,16,.92);display:none;z-index:50;flex-direction:column;}
  #lb.open{display:flex;}
  #lb .bar{display:flex;align-items:center;gap:14px;padding:12px 18px;border-bottom:1px solid var(--line);}
  #lb .bar b{font-size:15px;} #lb .bar .meta{color:var(--mut);font-size:12.5px;}
  #lb .zoomctl{margin-left:auto;display:flex;align-items:center;gap:4px;}
  #lb .zoomctl button{background:#1b2438;color:var(--ink);border:1px solid var(--line);border-radius:6px;cursor:pointer;font-size:14px;min-width:30px;height:28px;padding:0 8px;}
  #lb .zoomctl button:hover{border-color:var(--accent);}
  #lb .zoomctl #zlabel{min-width:50px;font-size:12.5px;color:var(--mut);background:none;border:0;}
  #lb .bar .x{margin-left:14px;cursor:pointer;font-size:22px;color:var(--mut);background:none;border:0;}
  #lb .stage{flex:1;display:flex;align-items:safe center;justify-content:safe center;overflow:auto;padding:16px;}
  #lb img{max-width:100%;border:1px solid var(--line);border-radius:8px;background:#fff;cursor:zoom-in;user-select:none;-webkit-user-drag:none;flex-shrink:0;}
  #lb .nav{position:absolute;top:50%;transform:translateY(-50%);font-size:40px;color:#fff;background:rgba(0,0,0,.35);
           border:0;cursor:pointer;padding:6px 16px;border-radius:8px;}
  #lb .prev{left:14px;} #lb .next{right:14px;}
  #lb .count{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);color:var(--mut);font-size:12.5px;}
</style></head>

</div>

enant/07_boundary_create_blank.png"]}, "caption": "Boundary create form, blank and filled \u2014 never submitted"}, "emp_bulk": {"shots": {"en": ["en/10_people/10_employees_bulk_import.png"]}, "caption": "Employee bulk import (XLSX upload)"}, "loc_bulk": {"shots": {"en": ["en/10_people/11_localization_bulk_import.png"]}, "caption": "Localization bulk import"}, "emp_inbox_v2": {"shots": {"en": ["en/15_employee_inbox/01_inbox_v2_my_complaints.png", "en/15_employee_inbox/02_inbox_v2_all_complaints.png"]}, "caption": "PGR inbox v2: complaint no / mobile / date search, subtype + county + status filters"}, "emp_inbox_v1": {"shots": {"en": ["en/15_employee_inbox/03_inbox_v1_legacy.png"]}, "caption": "Legacy PGR inbox"}, "emp_search": {"shots": {"en": ["en/18_employee_search/01_search_complaint_entry.png"]}, "caption": "Search Complaint"}, "emp_detail": {"shots": {"en": ["en/16_employee_complaint_detail/01_complaint_detail.png", "en/16_employee_complaint_detail/02_complaint_workflow_timeline.png"]}, "caption": "One complaint opened from the inbox, with its workflow history below the fold"}, "emp_new": {"shots": {"en": ["en/17_employee_new_complaint/04_create_complaint_filled_not_submitted.png", "en/17_employee_new_complaint/01_create_complaint_blank.png", "en/17_employee_new_complaint/02_dropdown_category_open.png", "en/17_employee_new_complaint/03_dropdown_county_open.png"]}, "caption": "New complaint intake: complainant, type/category/sub-type, map pin, description"}}};
const LANGS = [["en", "EN"]];
const LANG_URLS = {};
const STR = {"subtitle": "{captured}/{total} screens captured \u00b7 click a node to zoom its screenshots", "no_capture": "no capture", "alt_lang": "(other language)", "none": "no capture available"};
let lang = "en";

const GRAY = "data:image/svg+xml;utf8," + encodeURIComponent(
  '<svg xmlns="http://www.w3.org/2000/svg" width="240" height="150"><rect width="100%" height="100%" fill="#1b2438"/>'+
  '<text x="50%" y="50%" fill="#5b6b8c" font-family="sans-serif" font-size="13" text-anchor="middle" dy=".3em">'+STR.no_capture+'</text></svg>'
);

function imgFor(n){ const p=n.imgs[lang]; return p ? "_thumbs/"+p : GRAY; }

const visNodes = new vis.DataSet(DATA.nodes.map(n => ({
  id:n.id, label:n.label, level:n.level,
  shape:"image", image:imgFor(n),
  brokenImage:GRAY,
  size:34,
  font:{color:"#e8edf7", size:13, multi:false, vadjust:4, face:"-apple-system,Segoe UI,Roboto"},
  borderWidth:3, color:{border:n.captured? n.color : "#3a4660", background:"#121a2e"},
  shapeProperties:{useBorderWithImage:true},
  opacity: n.captured? 1 : 0.45,
})));

const visEdges = new vis.DataSet(DATA.edges.map((e,i)=>({
  id:"e"+i, from:e.from, to:e.to, label:e.label||undefined,
  arrows:{to:{enabled:true,scaleFactor:0.6}},
  color:{color:"#3a4660",highlight:"#2f6fdb"},
  font:{color:"#7f8db0",size:10,strokeWidth:0,align:"middle"},
  smooth:{type:"cubicBezier",forceDirection:"vertical",roundness:0.45},
})));

const container = document.getElementById("net");
const network = new vis.Network(container, {nodes:visNodes, edges:visEdges}, {
  layout:{hierarchical:{enabled:true,direction:"UD",sortMethod:"directed",levelSeparation:150,nodeSpacing:190,treeSpacing:230}},
  physics:false,
  interaction:{hover:true,zoomView:true,dragView:true,tooltipDelay:120},
  nodes:{labelHighlightBold:false},
});

network.on("click", params => {
  if(params.nodes.length){ openLb(params.nodes[0]); }
});

// ---- lightbox ----
let curNode=null, curShots=[], curIdx=0;
function shotsFor(id, l){ const s=(DATA.shots[id]||{}).shots||{}; return s[l]||[]; }
function openLb(id){
  curNode=id; curShots=shotsFor(id, lang); curIdx=0;
  const node = DATA.nodes.find(n=>n.id===id);
  document.getElementById("lbTitle").textContent = node? node.label : id;
  if(!curShots.length){
    // fallback to any other language that has captures
    for(const [code] of LANGS){
      if(code!==lang && shotsFor(id, code).length){ curShots = shotsFor(id, code); break; }
    }
    document.getElementById("lbMeta").textContent = curShots.length? STR.alt_lang : STR.none;
  } else {
    document.getElementById("lbMeta").textContent = "("+lang.toUpperCase()+")";
  }
  render();
  document.getElementById("lb").classList.add("open");
}
function shotName(p){ return p.split("/").pop().replace(/\.png$/,"").replace(/^\d+_/,"").replace(/_/g," "); }
function render(){
  const img=document.getElementById("lbImg");
  zoom=0;                                   // reset zoom on each new shot
  if(curShots.length){ img.src=curShots[curIdx]; img.style.display="block"; applyZoom(); }
  else { img.style.display="none"; }
  const nm = curShots.length? shotName(curShots[curIdx]) : "";
  const counter = curShots.length>1 ? (curIdx+1)+" / "+curShots.length+"  ·  " : "";
  document.getElementById("lbCount").textContent = counter + nm;
}
function step(d){ if(!curShots.length) return; curIdx=(curIdx+d+curShots.length)%curShots.length; render(); }
function closeLb(){ document.getElementById("lb").classList.remove("open"); }

// ---- zoom ----
let zoom=0; const ZLVL=[0,1,1.5,2,3];       // 0 = fit-to-screen; else multiplier of natural pixels
function applyZoom(){
  const img=document.getElementById("lbImg");
  if(zoom===0){ img.style.maxWidth="100%"; img.style.maxHeight="none"; img.style.width="auto"; img.style.height="auto"; img.style.cursor="zoom-in"; }
  else { img.style.maxWidth="none"; img.style.maxHeight="none"; img.style.height="auto";
         img.style.width=(img.naturalWidth*ZLVL[zoom])+"px"; img.style.cursor="grab"; }
  document.getElementById("zlabel").textContent = zoom===0 ? "Fit" : Math.round(ZLVL[zoom]*100)+"%";
}
function zoomBy(d){ zoom=Math.max(0,Math.min(ZLVL.length-1, zoom+d)); applyZoom(); }
function zoomToggle(){ zoom = zoom===0 ? 1 : 0; applyZoom(); }

// click image toggles fit/100% (unless it was a pan-drag); drag pans when zoomed
(function(){
  const img=document.getElementById("lbImg");
  const stage=document.querySelector("#lb .stage");
  let pan=null, moved=false;
  img.addEventListener("mousedown", e=>{ if(zoom===0){return;} pan={x:e.clientX,y:e.clientY,l:stage.scrollLeft,t:stage.scrollTop}; moved=false; img.style.cursor="grabbing"; e.preventDefault(); });
  window.addEventListener("mousemove", e=>{ if(!pan)return; if(Math.abs(e.clientX-pan.x)+Math.abs(e.clientY-pan.y)>3) moved=true; stage.scrollLeft=pan.l-(e.clientX-pan.x); stage.scrollTop=pan.t-(e.clientY-pan.y); });
  window.addEventListener("mouseup", ()=>{ if(pan){ pan=null; img.style.cursor="grab"; } });
  img.addEventListener("click", e=>{ if(moved){ moved=false; return; } zoomToggle(); });
})();

document.addEventListener("keydown",e=>{
  if(!document.getElementById("lb").classList.contains("open")) return;
  if(e.key==="Escape") closeLb();
  else if(e.key==="ArrowRight") step(1);
  else if(e.key==="ArrowLeft") step(-1);
  else if(e.key==="+"||e.key==="=") zoomBy(1);
  else if(e.key==="-"||e.key==="_") zoomBy(-1);
  else if(e.key==="0") { zoom=0; applyZoom(); }
});

// ---- language toggle ----
function setLang(l){
  lang=l;
  document.querySelectorAll(".toggle button").forEach(b=>b.classList.toggle("active", b.dataset.lang===l));
  DATA.nodes.forEach(n=> visNodes.update({id:n.id, image:imgFor(n)}));
  if(document.getElementById("lb").classList.contains("open") && curNode){ openLb(curNode); }
  if(LANG_URLS[l]){ try{ history.replaceState(null,'', LANG_URLS[l]); }catch(e){} }
}
document.querySelectorAll(".toggle button").forEach(b=>{ b.onclick=()=>setLang(b.dataset.lang); });

network.once("afterDrawing",()=>network.fit({animation:false}));
</script>
